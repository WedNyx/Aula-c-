name: Atualizar lock da camada interativa

on:
  workflow_dispatch:
  push:
    branches:
      - codex/interactive-stack-foundation
    paths:
      - package.json
      - .github/workflows/update-interactive-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenera package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Salva lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "package-lock já está atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update lockfile for interactive stack"
          git push
