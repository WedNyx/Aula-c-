name: Testes

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Build + suíte de testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Checagem de tipos (arquivos .ts já convertidos)
        run: npm run typecheck

      - name: Instala o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Roda a suíte inteira (build + testes de navegador + testes de API)
        run: npm test
